# Bumps the version of sdk/js and publishes it to public npm as
# @workablehr/apicco-sdk. Run manually from the Actions tab, choosing the
# bump type.
#
# Authentication is npm trusted publishing (OIDC): the id-token permission
# below lets npm mint a short-lived credential from the GitHub Actions
# identity, so no npm token is stored for this repository. It requires
# Workable/apicco to be registered as a trusted publisher for the package on
# npmjs, and npm >= 11.5.1 (which ships with Node 24).

name: '@workablehr/apicco-sdk package - bump version and publish to npm'

on:
  workflow_dispatch:
    inputs:
      version_bump_type:
        description: 'Version bump type (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish-js-sdk-npm-on-demand:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # No dependency install: sdk/js has no build step, and its
      # devDependencies (jest 24, nock 10) do not install cleanly on Node 24.
      # Nothing they produce ends up in the published tarball.
      - name: Bump Version
        run: npm version ${{ inputs.version_bump_type }} --no-git-tag-version
        working-directory: ./sdk/js

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PACKAGE_VERSION=$(node -p -e 'require("./package.json").version')
          git add package.json package-lock.json
          git commit -m "JS SDK - Bump version to $PACKAGE_VERSION"
          git tag "sdk-js-v$PACKAGE_VERSION"
          git push origin HEAD:master
          git push origin "sdk-js-v$PACKAGE_VERSION"
        working-directory: ./sdk/js

      - name: Publish to npm
        run: npm publish --ignore-scripts
        working-directory: ./sdk/js
